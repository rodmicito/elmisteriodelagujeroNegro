; ESP32-S3 Super Mini (ESP32-S3FH4R2: 4MB flash, 2MB PSRAM)
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 4MB
board_build.partitions = default.csv

monitor_speed = 115200

; Al subir, la placa se reinicia en modo carga y cambia de puerto COM:
; esto hace que PlatformIO la reinicie y espere el puerto nuevo
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

build_flags =
    ; USB nativo en modo TinyUSB: teclado + mouse + puerto serial a la vez
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
